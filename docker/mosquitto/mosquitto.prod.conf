# Mosquitto para PRODUCCIÓN (docker-compose.prod.yml).
#
# - 1883: sin TLS, para la red local de planta.
# - 8883: con TLS, para conexiones desde fuera de la red local.
# En ambos puertos se exige usuario y contraseña (passwd) y se aplican permisos por topic (acl).
# Archivos requeridos (no se versionan, ver README > Producción > Mosquitto):
#   docker/mosquitto/auth/passwd       usuarios (mosquitto_passwd)
#   docker/mosquitto/auth/acl          permisos por usuario/topic (parte de acl.example)
#   docker/mosquitto/certs/server.crt  certificado del servidor (cadena completa)
#   docker/mosquitto/certs/server.key  clave privada

# Autenticación global para todos los listeners
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Red local (sin TLS)
listener 1883

# Externo (TLS)
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Descomenta para exigir además certificado de cliente firmado por tu CA:
# cafile /mosquitto/certs/ca.crt
# require_certificate true
