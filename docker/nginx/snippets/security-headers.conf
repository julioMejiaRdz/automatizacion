# Cabeceras de seguridad. Se incluyen en cada location que define sus propias add_header,
# porque Nginx no hereda add_header del bloque padre en ese caso.
# HSTS solo en HTTPS: $hsts_header está vacío sobre HTTP y Nginx omite la cabecera (ver http-common.conf)
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# style-src necesita 'unsafe-inline' porque React/Radix/motion aplican estilos inline
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
