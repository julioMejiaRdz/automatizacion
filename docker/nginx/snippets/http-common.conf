# Directivas a nivel http (los archivos de conf.d se incluyen dentro del bloque http).

server_tokens off;
client_max_body_size 1m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# Límite de peticiones por IP hacia la API (el backend tiene además su propio rate limit en /api/auth)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# Cabecera Connection correcta para WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HSTS (el navegador usará solo HTTPS durante 2 años) únicamente cuando la petición llega por HTTPS
map $scheme $hsts_header {
    https   "max-age=63072000";
    default "";
}
